<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio citron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,200..800;1,200..800&family=Italiana&family=Syne:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070b; --ink:#ece8d9; --muted:#8e8c85;
  --panel:#0b0c11; --line:#1a1b22; --field:#14151b; --edge:#25262e;
  --stage-h:clamp(300px,34vw,480px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:48px 0}

section.opt{margin:0 0 72px}
section.opt.tall{--stage-h:clamp(380px,46vw,640px)}
.grp{max-width:1120px;margin:0 auto;padding:24px 24px 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5f5e58}
.num{max-width:1120px;margin:0 auto;padding:0 24px 14px;display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline;font:400 13px/1.4 Helvetica,"Helvetica Neue",Arial,sans-serif;color:var(--muted)}
.num b{font-weight:500;color:var(--ink)}
.num i{font-style:normal;color:#6d6b65}
.idx{max-width:1120px;margin:0 auto 44px;padding:0 24px;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px}
.idx a{color:var(--muted);text-decoration:none}
.idx a:hover{color:var(--ink)}
.idx a span{color:#5f5e58;margin-right:5px}
.opt-body{display:grid;grid-template-columns:minmax(0,1fr) 300px}
.stage{position:relative;height:var(--stage-h);overflow:hidden;background:#000;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.interactive{cursor:crosshair}

/* ---------- control panel ---------- */
.panel{height:var(--stage-h);overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);font-size:12px;line-height:1.3;color:#c9c6bb;scrollbar-width:thin;scrollbar-color:#2a2b33 transparent}
.panel header{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.panel header b{flex:1;font-weight:500;color:var(--ink);letter-spacing:.02em}
.panel button{font:inherit;font-size:11px;color:#c9c6bb;background:var(--field);border:1px solid var(--edge);border-radius:4px;padding:3px 8px;cursor:pointer}
.panel button:hover{color:var(--ink);border-color:#3a3b44}
.panel details{border-bottom:1px solid #15161c}
.panel summary{padding:9px 12px;cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;list-style:none;user-select:none}
.panel summary::-webkit-details-marker{display:none}
.panel summary::before{content:'\203A';display:inline-block;width:12px;transition:transform .15s}
.panel details[open] summary::before{transform:rotate(90deg)}
.panel details[open]{padding-bottom:8px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 40px;align-items:center;gap:8px;padding:3px 12px;min-height:24px}
.row.wide{grid-template-columns:88px minmax(0,1fr)}
.row .lab{color:#a19e94;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;position:relative}
.row.changed .lab{color:var(--ink)}
.row.changed .lab::after{content:'';display:inline-block;width:4px;height:4px;border-radius:50%;background:#e8c766;margin-left:5px;vertical-align:middle}
.row output{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.row input[type=range]{width:100%;accent-color:#d9d4c2;margin:0}
.row input[type=color]{width:100%;height:20px;border:1px solid var(--edge);background:none;padding:0;border-radius:3px;cursor:pointer}
.row input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.row input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}
.row select,.row input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--edge);border-radius:3px;padding:3px 5px}
.row input[type=checkbox]{accent-color:#d9d4c2;margin:0;justify-self:start}
.panel .hint{padding:2px 12px 6px;color:#6d6b65;font-size:11px}
.panel .sub{margin:6px 12px 2px;padding-top:7px;border-top:1px solid #17181e;color:#7b7972;font-size:11px}
.panel summary + .hint + .sub{border-top:0;margin-top:0;padding-top:2px}

@media (max-width:860px){
  .opt-body{grid-template-columns:1fr}
  .panel{height:auto;max-height:70vh;border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>

<main></main>

<script>
(async function(){
const TAU = Math.PI * 2;
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- wordmark renderer (canvas) ---------- */
const F = {
  corm: "'Cormorant Garamond', serif",
  fraun: "'Fraunces', serif",
  ital: "'Italiana', serif",
  syne: "'Syne', sans-serif",
  instr: "'Instrument Serif', serif",
  inter: "'Inter Tight', sans-serif",
};
const FONT_NAMES = { corm: 'Cormorant Garamond', fraun: 'Fraunces', ital: 'Italiana', syne: 'Syne', instr: 'Instrument Serif', inter: 'Inter Tight' };
// The one mark (Sunken moon's): every scene sets only where it sits and, by day, its colours.
const LOGO = {
  word: 'citron', studio: 'studio', mode: 'above',        // above | below | inline | none
  font: F.fraun, weight: 600, style: 'normal', upper: false, track: 0,
  sFont: null, sWeight: 600, sStyle: 'normal', sSize: .14, sTrack: .6, sGap: .14, sAlign: 'start', sUpper: true,
  ink: '#f4f0e0', sInk: null,
  glow: 'rgba(255,238,190,.6)', glowSize: .22,
  glow2: 'rgba(255,248,228,.75)', glow2Size: .045,
  halo: .11, haloRGB: '255,236,180',
  moon: { light: '#fffef6', mid: '#f2ecd2', edge: '#c9bd94', mare: '125,115,85' },
  moonScale: 1.12, moonGap: .035, moonHalo: .38, flatMoon: false,
  box: [0, 0, 1, 1], fill: .72, maxH: .56, yShift: .02,
};
const fontStr = (size, weight, style, fam) => `${style} ${weight} ${size}px ${fam}`;

// The shaders' hash / noise / fbm3, so the logo's maria match the sky moon in Moonrise
const fract = v => v - Math.floor(v);
const hash2 = (x, y) => { x = fract(x * 123.34); y = fract(y * 456.21); const d = x * (x + 45.32) + y * (y + 45.32); return fract((x + d) * (y + d)); };
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return (a + (b - a) * ux) * (1 - uy) + (c + (d - c) * ux) * uy;
}
function fbm3(x, y) { let v = 0, a = .5; for (let i = 0; i < 3; i++) { v += a * noise2(x, y); x = x * 2.02 + 17.13; y = y * 2.02 + 9.71; a *= .5; } return v; }
const smooth = (a, b, v) => { const t = Math.min(Math.max((v - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

function drawMoon(c, x, y, r, m, flat) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  if (flat) { c.fill(); c.restore(); return; }
  const g = c.createRadialGradient(x - r * .32, y - r * .36, r * .05, x, y, r * 1.02);
  g.addColorStop(0, m.light); g.addColorStop(.55, m.mid); g.addColorStop(1, m.edge);
  c.fillStyle = g; c.fill(); c.clip();
  // maria: the sky moon's noise field over the disc, laid on in the mare colour
  const n = Math.max(2, Math.ceil(r * 2)), mc = document.createElement('canvas');
  mc.width = mc.height = n;
  const mx = mc.getContext('2d'), img = mx.createImageData(n, n), px = img.data;
  const [mr, mg, mb] = m.mare.split(',').map(Number);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u = (i + .5) / n * 2 - 1, v = 1 - (j + .5) / n * 2, k = (j * n + i) * 4;
    px[k] = mr; px[k + 1] = mg; px[k + 2] = mb;
    px[k + 3] = 255 * .20 * smooth(.4, .65, fbm3(u * 1.5 + 3.1, v * 1.5 + 3.1));
  }
  mx.putImageData(img, 0, 0);
  c.drawImage(mc, x - r, y - r, 2 * r, 2 * r);
  c.restore();
}

function makeLogo(W, H, opts) {
  const o = { ...LOGO, ...opts, moon: { ...LOGO.moon, ...(opts.moon || {}) } };
  const sFont = o.sFont || o.font;
  const m = document.createElement('canvas').getContext('2d');
  const S = 100;
  const word = o.upper ? o.word.toUpperCase() : o.word;
  const mi = word.search(/o/i), hasMoon = mi >= 0;
  const pre = hasMoon ? word.slice(0, mi) : word, post = hasMoon ? word.slice(mi + 1) : '';

  m.font = fontStr(S, o.weight, o.style, o.font);
  const xh = m.measureText(o.upper ? 'H' : 'x').actualBoundingBoxAscent;
  m.letterSpacing = `${o.track * S}px`;
  const D = hasMoon ? xh * o.moonScale : 0, gap = hasMoon ? S * o.moonGap : 0;
  const asc = Math.max(m.measureText(pre + post).actualBoundingBoxAscent, D);
  const wPre = m.measureText(pre).width, wPost = m.measureText(post).width;
  const wordW = wPre + gap * 2 + D + wPost;
  m.letterSpacing = '0px';

  const st = o.sUpper ? o.studio.toUpperCase() : o.studio;
  const inline = o.mode === 'inline';
  const sSize = inline ? S : S * o.sSize;
  m.font = fontStr(sSize, o.sWeight, o.sStyle, sFont);
  const sTr = inline ? 0 : sSize * o.sTrack;
  const chars = [...st], cw = chars.map(ch => m.measureText(ch).width);
  const sW = inline ? m.measureText(st).width : cw.reduce((a, b) => a + b, 0) + sTr * (chars.length - 1);
  const sAsc = m.measureText(st).actualBoundingBoxAscent;
  const space = S * .26;

  let totalW, totalH;
  if (inline) { totalW = sW + space + wordW; totalH = Math.max(asc, sAsc); }
  else if (o.mode === 'none') { totalW = wordW; totalH = asc; }
  else { totalW = Math.max(wordW, sW); totalH = asc + sAsc + S * o.sGap; }

  const bx = o.box[0] * W, by = o.box[1] * H, bw = o.box[2] * W, bh = o.box[3] * H;
  const k = Math.min(bw * o.fill / totalW, bh * o.maxH / totalH);
  const x0 = bx + (bw - totalW * k) / 2, y0 = by + (bh - totalH * k) / 2 + o.yShift * bh;

  let wx = x0 + (totalW - wordW) * k / 2, base = y0 + totalH * k, sBase = base, sx = x0;
  if (inline) { wx = x0 + (sW + space) * k; }
  else if (o.mode === 'above') { sBase = y0 + sAsc * k; }
  else if (o.mode === 'below') { base = y0 + asc * k; sBase = y0 + totalH * k; }
  if (!inline) {
    sx = o.sAlign === 'center' ? x0 + (totalW - sW) * k / 2
       : o.sAlign === 'end' ? wx + wordW * k - sW * k
       : wx;
  }

  const ink = document.createElement('canvas'); ink.width = W; ink.height = H;
  const c = ink.getContext('2d');
  c.fillStyle = o.ink;
  c.font = fontStr(S * k, o.weight, o.style, o.font);
  c.letterSpacing = `${o.track * S * k}px`;
  c.fillText(pre, wx, base);
  // re-measure at the drawn size: optical-size fonts (Fraunces) set tighter when large
  const wPreK = c.measureText(pre).width;
  const r = D * k / 2, mx = wx + wPreK + gap * k + r, my = base - r + D * k * .012;
  if (hasMoon) drawMoon(c, mx, my, r, o.moon, o.flatMoon);
  c.fillText(post, wx + wPreK + (gap * 2 + D) * k, base);
  c.letterSpacing = '0px';
  if (o.mode !== 'none') {
    c.fillStyle = o.sInk || o.ink;
    c.font = fontStr(sSize * k, o.sWeight, o.sStyle, sFont);
    if (inline) c.fillText(st, sx, sBase);
    else { let x = sx; chars.forEach((ch, i) => { c.fillText(ch, x, sBase); x += (cw[i] + sTr) * k; }); }
  }

  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d');
  if (o.halo > 0) {
    const cx = x0 + totalW * k / 2, cy = y0 + totalH * k / 2, R = totalW * k * .62;
    g.save(); g.translate(cx, cy); g.scale(1, .42);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, `rgba(${o.haloRGB},${o.halo})`); gr.addColorStop(1, `rgba(${o.haloRGB},0)`);
    g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
  }
  if (hasMoon && o.moonHalo > 0) {
    const gr = g.createRadialGradient(mx, my, r * .9, mx, my, r * 3.4);
    gr.addColorStop(0, `rgba(${o.haloRGB},${o.moonHalo})`); gr.addColorStop(1, `rgba(${o.haloRGB},0)`);
    g.fillStyle = gr; g.fillRect(mx - r * 3.4, my - r * 3.4, r * 6.8, r * 6.8);
  }
  const glowPass = (color, blur) => { g.save(); g.shadowColor = color; g.shadowBlur = blur; g.drawImage(ink, 0, 0); g.restore(); };
  if (o.glowSize > 0) glowPass(o.glow, S * k * o.glowSize);
  if (o.glow2Size > 0) glowPass(o.glow2, S * k * o.glow2Size);
  g.drawImage(ink, 0, 0);
  return { canvas: out, moon: { x: mx, y: my, r: Math.max(r, 1) }, box: { x: x0, y: y0, w: totalW * k, h: totalH * k } };
}

/* ---------- per-option wordmark settings ---------- */
// By day the ink goes dark, and the moon darkens the same way: each of the night moon's colours
// scaled channel by channel by (day ink / night ink), so it keeps its shading and maria.
function dayMark(ink) {
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const t = rgb(ink).map((v, i) => v / rgb(LOGO.ink)[i]);
  const tint = c => c.map((v, i) => Math.min(255, Math.round(v * t[i])));
  const hex = h => '#' + tint(rgb(h)).map(v => v.toString(16).padStart(2, '0')).join('');
  const m = LOGO.moon;
  return { ink, moon: { light: hex(m.light), mid: hex(m.mid), edge: hex(m.edge), mare: tint(m.mare.split(',').map(Number)).join(',') } };
}
const NO_GLOW = { glowSize: 0, glow2Size: 0, halo: 0 };
const SUNKEN_MARK = { ...NO_GLOW, moonHalo: 0, fill: .8, maxH: .9, yShift: 0 };
const CFG = {
  // originals
  pond:     { fill: .6, maxH: .55 },
  moonrise: { box: [0, .06, 1, .48], fill: .56, maxH: .62, yShift: 0 },
  pool:     { fill: .6, maxH: .55 },
  shallows: { ...dayMark('#1f2b52'), glow: 'rgba(255,206,84,.75)', glowSize: .2, glow2: 'rgba(255,236,160,.8)', glow2Size: .05,
              halo: .22, haloRGB: '255,196,60', moonHalo: .7, fill: .62 },
  depths:   { glowSize: .26, glow2Size: .05, halo: .16, moonHalo: .5, box: [0, .3, 1, .5], fill: .56, maxH: .62, yShift: 0 },
  // hybrids
  nightpool: { glowSize: .2, glow2Size: .045, halo: .1, moonHalo: .45, fill: .6, maxH: .55 },
  below:     { glowSize: .26, glow2Size: .05, halo: .14, moonHalo: .5, fill: .56, maxH: .5, yShift: -.04 },
  // new
  mist:      { ...dayMark('#2b3340'), glow: 'rgba(255,255,255,.55)', glowSize: .14, glow2: 'rgba(255,255,255,.4)', glow2Size: .03,
               halo: 0, haloRGB: '255,255,255', moonHalo: .3, box: [0, .06, 1, .46], fill: .56, maxH: .62, yShift: 0 },
  lagoon:    { ...dayMark('#fffaf0'), glow: 'rgba(255,255,255,.5)', glowSize: .12, glow2: 'rgba(255,255,255,.8)', glow2Size: .035,
               halo: .1, haloRGB: '255,255,240', moonHalo: .3, fill: .6, maxH: .55 },
  // Sunken moon through the day: bloom and halos come from the shader instead
  sunrise: SUNKEN_MARK, noon: SUNKEN_MARK, sunset: SUNKEN_MARK, seamoonrise: SUNKEN_MARK, moonless: SUNKEN_MARK,
};

const GLYPHS = 'Studio citron STUDIO CITRON';
const loadFonts = o => Promise.all([
  fontStr(40, o.weight, o.style, o.font),
  fontStr(40, o.sWeight, o.sStyle, o.sFont || o.font),
].map(f => document.fonts.load(f, GLYPHS).catch(() => {})));
await Promise.all(Object.values(CFG).map(c => loadFonts({ ...LOGO, ...c })));

/* ---------- shared animation loop ---------- */
const views = [];
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = views.find(v => v.el === e.target);
  if (v) { v.visible = e.isIntersecting; v.needs = true; }
}), { rootMargin: '80px' });
function register(el, draw) {
  const v = { el, draw, visible: false, needs: true };
  views.push(v); io.observe(el);
  return v;
}
function watchResize(el, fn) {
  let tm;
  new ResizeObserver(() => { clearTimeout(tm); tm = setTimeout(fn, 120); }).observe(el);
  fn();
}
function loop() {
  for (const v of views) {
    if (!v.visible || (REDUCED && !v.needs)) continue;
    v.needs = false;
    v.draw();
  }
  requestAnimationFrame(loop);
}
const rel = (e, el) => { const r = el.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };

/* ---------- WebGL views ---------- */
// Each scene renders from FC (its own fragment coordinate) into OUT; the shared main()
// below maps screen pixels through zoom and pan into FC and grades the result.
const PRELUDE = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uDpr;
uniform vec4 uDrops[8];
uniform vec3 uMouse, uMoon;
uniform vec4 uBox;
uniform float uLightK, uWave, uVig, uHz;
uniform vec3 uLightDir, uLightCol, uBgTint;
uniform vec4 uX;
vec4 FC; vec4 OUT; vec2 SUV;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02+vec2(17.13,9.71); a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.02+vec2(17.13,9.71); a*=.5; } return v; }
vec2 toP(vec2 f){ return (f-.5*uRes)/uRes.y; }
vec2 pToUv(vec2 p){ return p*vec2(uRes.y/uRes.x,1.)+.5; }
vec4 logoAt(vec2 uv){ return texture2D(uTex, clamp(uv, vec2(.001), vec2(.999))); }
float vignette(vec2 uv){ vec2 q=SUV-.5; return 1.-dot(q,q)*.85*uVig; }
float dropHs(vec2 p, float speed, float k, float ys){
  float h=0.; float asp=uRes.x/uRes.y;
  for(int i=0;i<8;i++){
    vec4 d=uDrops[i]; float age=uTime-d.z;
    if(age<0. || age>8.) continue;
    vec2 c=vec2((d.x-.5)*asp, d.y-.5);
    float r=length((p-c)*vec2(1.,ys)); float x=r-age*speed;
    h+=d.w*sin(x*k)*exp(-x*x*18.)*exp(-age*.5)/(1.+r*5.);
  }
  return h;
}
float dropH(vec2 p, float speed, float k){ return dropHs(p,speed,k,1.); }
vec2 dropG(vec2 p, float speed, float k, float ys){
  float e=1.5/uRes.y;
  return vec2(dropHs(p+vec2(e,0.),speed,k,ys)-dropHs(p-vec2(e,0.),speed,k,ys),
              dropHs(p+vec2(0.,e),speed,k,ys)-dropHs(p-vec2(0.,e),speed,k,ys))/(2.*e);
}
// Softened wordmark coverage: used for shadows the mark throws onto a floor.
float softA(vec2 uv, float b){
  return (logoAt(uv).a+logoAt(uv+vec2(b,0.)).a+logoAt(uv-vec2(b,0.)).a+logoAt(uv+vec2(0.,b)).a+logoAt(uv-vec2(0.,b)).a)*.2;
}
float caus(vec2 p, float t){
  vec2 i=floor(p), f=fract(p); float d1=8., d2=8.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y));
    vec2 o=.5+.42*sin(t+6.2831*vec2(hash(i+g),hash(i+g+5.31)));
    float d=length(g+o-f);
    if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }
  }
  return 1.-smoothstep(0.,.2,d2-d1);
}
`;

const POST = `
uniform float uZoom, uExposure, uContrast, uSat, uHue, uGrain;
uniform vec2 uPan;
uniform vec3 uTint;
vec3 hueRot(vec3 c, float a){ const vec3 k=vec3(.57735); float ca=cos(a); return c*ca+cross(k,c)*sin(a)+k*dot(k,c)*(1.-ca); }
void main(){
  SUV=gl_FragCoord.xy/uRes;
  vec2 q=(gl_FragCoord.xy-.5*uRes)/uRes.y/uZoom+uPan;
  FC=vec4(q*uRes.y+.5*uRes,0.,1.);
  scene();
  vec3 col=OUT.rgb*uExposure;
  col=hueRot(col,uHue);
  col=mix(vec3(dot(col,vec3(.2126,.7152,.0722))),col,uSat);
  col=max((col-.25)*uContrast+.25,0.);
  col*=uTint;
  col+=(hash(gl_FragCoord.xy+fract(uTime*7.)*91.)-.5)*uGrain*.15;
  gl_FragColor=vec4(col,1.);
}`;

const FS = {};

/* 01 Pond — dark water, pointer ripples, rain. */
FS.pond = `
float H(vec2 p){
  float s=fbm(p*vec2(2.,2.*P.swellStretch)*P.swellScale+vec2(uTime*.05,-uTime*.07)*P.swellDrift);
  return dropH(p,.3*uX.x,P.ringFreq)*P.ringAmp + (s-.5)*.09*uX.y + sin(p.y*P.streakFreq+p.x*3.+uTime*1.1+s*5.)*P.streakAmp;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, e=1.5/uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract;
  vec4 L=logoAt(pToUv(p-off));
  vec3 bg=mix(P.deepCol, P.farCol, uv.y);
  bg+=(fbm(p*P.texScale-off*12.)-.5)*.022*uX.w;
  bg*=uBgTint;
  vec3 col=bg*(1.-L.a)+L.rgb;
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  float spec=pow(max(dot(n,uLightDir),0.),P.glintSharp);
  col+=spec*P.glintCol*P.glintAmt*uLightK*uLightCol;
  // ripple facets that face the moon catch its light
  vec2 mp=vec2((uMoon.x-.5)*asp, uMoon.y-.5);
  float md=length(p-mp);
  vec3 tm=normalize(vec3(mp-p,P.sheenHeight));
  float sheen=pow(max(dot(n,tm),0.),P.sheenSharp)*exp(-md*P.sheenFalloff)*uX.z;
  col+=P.sheenCol*sheen*P.sheenAmt*(1.-L.a)*uLightK;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 02 Moonrise — horizon, reflection, glitter path. */
FS.moonrise = `
vec3 sky(float y){
  float hz=uHz; float s=clamp((y-hz)/(1.-hz),0.,1.);
  vec3 c=mix(P.skyLow, P.skyHigh, pow(s,P.skyCurve));
  return (c+P.duskCol*exp(-s*P.duskFalloff)*P.duskAmt)*uBgTint;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, hz=uHz, t=uTime;
  vec3 col;
  if(uv.y>hz){
    vec3 s=sky(uv.y);
    vec2 sp=floor(gl_FragCoord.xy/(2.*uDpr));
    float st=hash(sp);
    s+=step(1.-P.starDensity,st)*(.55+.45*sin(t*P.twinkle+st*90.))*vec3(.75)*smoothstep(hz,hz+.25,uv.y)*uX.x;
    float md=length((uv-uMoon.xy)*vec2(asp,1.));
    s+=vec3(.95,.9,.7)*.07*exp(-md*P.moonGlowFalloff)*uX.y;
    vec4 L=logoAt(uv);
    col=s*(1.-L.a)+L.rgb;
  } else {
    float d=(hz-uv.y)/hz;
    float z=1./(d+P.persp);
    float X=(uv.x-.5)*asp*z;
    vec2 wp=vec2(X*1.4, z*1.6)*P.waveScale+vec2(0.,t*.45*P.waveFlow);
    vec2 ws=vec2(1.,P.waveStretch);
    float n1=fbm3(wp*ws), n2=fbm3(wp*ws+vec2(7.3,2.1)-t*.15*P.waveFlow);
    float amp=(.25+d)*uWave;
    float ox=(n1-.5)*P.sway*amp, oy=(n2-.5)*P.bob*amp;
    float ry=2.*hz-uv.y;
    vec4 R=vec4(0.);
    float jt=hash(gl_FragCoord.xy*.37)-.5;
    for(int k=-2;k<=2;k++) R+=logoAt(vec2(uv.x+ox, ry+oy+(float(k)+jt)*.004*(.3+d)*uX.w));
    R/=5.;
    vec3 refl=sky(ry+oy)*(1.-R.a)+R.rgb;
    float fres=mix(P.reflFar,P.reflNear,d);
    col=mix(P.waterCol*uBgTint, refl*P.reflTint, fres);
    float wdt=(.012+d*.09)*uX.z;
    float mask=exp(-pow((uv.x+ox*1.5-uMoon.x)/wdt,2.));
    float sp=pow(noise(vec2(X*16., z*26.)*P.glitterScale-vec2(0.,t*1.6*P.glitterSpeed)),P.glitterSharp)*P.glitterAmt;
    col+=P.glitterCol*mask*(sp*(.4+d)+P.pathGlow)*uLightK*uLightCol;
  }
  col+=vec3(.12,.11,.14)*exp(-abs(uv.y-hz)*140.)*P.hzLine;
  col+=vec3(.09,.09,.13)*exp(-max(uv.y-hz,0.)*28.)*P.hzHaze*smoothstep(hz-.01,hz,uv.y);
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 03 Pool — tiled floor, caustics, now with the mark's shadow on the tiles. */
FS.pool = `
float H(vec2 p){ return fbm3(p*P.wave1Scale+vec2(uTime*.12,uTime*.07)*P.drift) + fbm3(p*P.wave2Scale-vec2(uTime*.1,0.)*P.drift)*P.wave2Amt; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract;
  vec2 fp=p-off;
  vec2 tf=abs(fract(fp*uX.x)-.5);
  float grout=smoothstep(.5-P.groutWidth,.52-P.groutWidth,max(tf.x,tf.y));
  vec3 floorC=mix(P.deepCol, P.shallowCol, uv.y*.7+.15);
  floorC*=(1.-grout*uX.y)*uBgTint;
  float sh=softA(pToUv(fp-uLightDir.xy*P.shadowOffset+g*.003), P.shadowBlur);
  floorC*=1.-sh*.5*uX.w;
  float c=pow(caus(fp*3.*uX.z+g*P.causWarp,uTime*.9*P.causSpeed),P.causSharp1)*P.caus1 + pow(caus(fp*5.2*uX.z+vec2(3.1,7.7),uTime*1.15*P.causSpeed),P.causSharp2)*P.caus2;
  vec4 L=logoAt(pToUv(fp));
  vec3 col=floorC*(1.-L.a)+L.rgb*P.markTint;
  col+=c*P.causCol*P.causAmt*uLightK*uLightCol*(1.-L.a*.6);
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  col+=pow(max(dot(n,uLightDir),0.),P.glintSharp)*P.glintCol*P.glintAmt*uLightK*uLightCol;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 04 Shallows — sand and aqua, caustics. */
FS.shallows = `
float H(vec2 p){ return fbm3(p*P.wave1Scale+vec2(uTime*.08,uTime*.05)*P.drift) + fbm3(p*P.wave2Scale-vec2(uTime*.06,0.)*P.drift)*P.wave2Amt; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract;
  vec2 fp=p-off;
  vec3 bg=mix(P.aquaCol,P.sandCol,smoothstep(-P.shoreSoft,P.shoreSoft,fp.x*.35+fp.y*.8+P.shoreNoise*(fbm3(fp*2.)-.5)+uX.y));
  bg*=(1.-uX.x)+uX.x*sin((fp.x*28.+fp.y*6.)*P.rippleScale+fbm3(fp*2.)*9.);
  float sh=softA(pToUv(fp-uLightDir.xy*P.shadowOffset+g*.003), P.shadowBlur);
  bg*=1.-sh*.35*uX.w;
  bg*=uBgTint;
  float c=pow(caus(fp*2.6*uX.z+g*P.causWarp,uTime*.8*P.causSpeed),P.causSharp1)*P.caus1 + pow(caus(fp*4.4*uX.z+9.,uTime*P.causSpeed),P.causSharp2)*P.caus2;
  vec4 L=logoAt(pToUv(fp));
  vec3 col=bg*(1.-L.a)+L.rgb;
  col+=c*P.causCol*P.causAmt*uLightK*uLightCol*(1.-L.a*.7);
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  col+=pow(max(dot(n,uLightDir),0.),P.glintSharp)*P.glintCol*P.glintAmt*uLightK*uLightCol;
  col*=.94+.06*vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 05 Depths — underwater, looking across at the surface. */
FS.depths = `
#define LITE (P.lite*uLightCol)
float H(vec2 p){ return fbm3(p+vec2(uTime*.09,-uTime*.06)*P.drift); }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, t=uTime, hz=uHz, ys=P.mirrorLine;
  vec2 sw=vec2(fbm3(p*P.swayScale+vec2(t*.13,0.)), fbm3(p*P.swayScale+vec2(4.1,t*.11)))-.5;
  vec2 q=uv+sw*vec2(.007,.009)*P.sway*uWave;
  vec3 fogC=mix(P.fogDeep, P.fogLight, smoothstep(.25,.95,q.y));
  vec3 col; float fog;
  if(q.y>hz){
    float d=q.y-hz, z=.2/d;
    vec2 sp=vec2((q.x-.5)*asp*z, z*1.4+t*.18);
    float w=H(sp*.9*P.surfScale);
    float c=pow(caus(sp*2.+w*1.2,t*.7*P.causSpeed),2.)*.9 + pow(caus(sp*3.4+vec2(5.3,1.7)-w,t*.9*P.causSpeed),2.)*.35;
    col=P.surfCol+c*LITE*P.surfCaus*uLightK;
    float wv=(w-.5)*(.02+.06*d)*uWave;
    vec4 R=logoAt(vec2(q.x+wv*1.4, 2.*ys-q.y+wv));
    col=col*(1.-R.a*min(uX.z*1.1,1.))+R.rgb*P.reflTint*uX.z*smoothstep(ys,ys+.015,q.y);
    // the moon's reflection pools light on the underside of the surface
    vec2 rm=vec2(uMoon.x, 2.*ys-uMoon.y);
    col+=LITE*P.moonPool*exp(-length((q-rm)*vec2(asp,1.))*P.moonPoolFalloff)*uX.z*smoothstep(ys,ys+.015,q.y);
    fog=exp(-z*P.surfFog);
  } else {
    float d=hz-q.y, z=.28/d;
    vec2 fp=vec2((q.x-.5)*asp*z, z*1.2+t*.04);
    vec2 tf=abs(fract(fp*P.tileDensity+vec2(.5,0.))-.5);
    float grout=smoothstep(.465,.49,max(tf.x,tf.y));
    float w=H(fp*.8);
    float c=pow(caus(fp*1.7+w*1.3,t*.8*P.causSpeed),2.)*.75 + pow(caus(fp*3.+vec2(3.1,7.7)-w,t*1.05*P.causSpeed),2.)*.3;
    col=P.floorCol*(1.-grout*P.grout)+c*LITE*P.floorCaus*uLightK;
    fog=exp(-z*P.floorFog);
  }
  col=mix(fogC,col,fog)*uBgTint;
  float a=(q.x-.5-uX.w)*asp/(1.7-q.y);
  float rays=pow(fbm3(vec2(a*P.rayFreq+t*.04*P.rayDrift,t*.07*P.rayDrift)),P.raySharp)*smoothstep(.05,.95,q.y);
  col+=LITE*rays*uX.x;
  vec4 L=logoAt(q);
  float lc=pow(caus(p*4.2+sw*2.,t*.8),2.);
  col=col*(1.-L.a)+L.rgb*P.markTint*(.85+lc*P.markCaus*uLightK);
  vec2 pp=p*vec2(9.,7.)-vec2(0.,t*.1);
  vec2 ci=floor(pp), cf=fract(pp);
  float h=hash(ci);
  vec2 o=vec2(hash(ci+1.7),hash(ci+3.1))*.8+.1+.07*sin(t*.5+h*20.+vec2(0.,1.6));
  col+=smoothstep(P.moteSize,0.,length(cf-o))*step(1.-P.moteDensity,h)*LITE*(.1+.1*sin(t+h*40.))*uX.y;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 06 Night pool — Pool's tiles and caustics under Moonrise's night, with Pond's ripples. */
FS.nightpool = `
float H(vec2 p){ return fbm3(p*P.wave1Scale+vec2(uTime*.12,uTime*.07)*P.drift)*P.wave1Amt + fbm3(p*P.wave2Scale-vec2(uTime*.1,0.)*P.drift)*P.wave2Amt + dropH(p,.3,P.ringFreq)*P.ringAmp; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract;
  vec2 fp=p-off;
  vec2 tf=abs(fract(fp*uX.x)-.5);
  float grout=smoothstep(.5-P.groutWidth,.52-P.groutWidth,max(tf.x,tf.y));
  vec3 floorC=mix(P.deepCol, P.shallowCol, uv.y*.7+.15);
  floorC*=(1.-grout*uX.y)*uBgTint;
  vec2 mp=vec2((uMoon.x-.5)*asp, uMoon.y-.5);
  float md=length(fp-mp);
  float moonlit=exp(-md*P.moonFalloff)*uX.w;
  float c=pow(caus(fp*3.*uX.z+g*P.causWarp,uTime*.8*P.causSpeed),P.causSharp1)*P.caus1 + pow(caus(fp*5.2*uX.z+vec2(3.1,7.7),uTime*P.causSpeed),P.causSharp2)*P.caus2;
  vec4 L=logoAt(pToUv(fp));
  vec3 col=floorC*(1.-L.a)+L.rgb;
  col+=c*P.causCol*(P.causAmt+P.moonCaus*moonlit)*uLightK*uLightCol*(1.-L.a*.6);
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  col+=pow(max(dot(n,uLightDir),0.),P.glintSharp)*P.glintCol*P.glintAmt*uLightK*uLightCol;
  vec3 tm=normalize(vec3(mp-p,P.sheenHeight));
  col+=pow(max(dot(n,tm),0.),P.sheenSharp)*P.sheenCol*P.sheenAmt*moonlit*uLightK*(1.-L.a);
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 07 Below — Depths' underwater view turned straight up at Moonrise's sky: the mark sits above the water, seen through it. */
FS.below = `
#define LITE (P.lite*uLightCol)
float H(vec2 q){ return fbm3(q*P.wave1Scale+vec2(uTime*.1,-uTime*.07)*P.drift) + fbm3(q*P.wave2Scale-vec2(uTime*.08,uTime*.05)*P.drift)*P.wave2Amt + dropH(q,.3,P.ringFreq)*P.ringAmp; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, t=uTime, e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract*vec2(uRes.y/uRes.x,1.);
  // Snell's window: inside it the sky shows through; beyond it the surface mirrors the dark pool
  float win=1.-smoothstep(P.winEdge,P.winEdge+P.winSoft,length(p*vec2(.75,1.5))*uX.x);
  vec2 q=uv+off;
  vec3 sky=mix(P.skyLow, P.skyHigh, q.y)*uBgTint;
  float st=hash(floor(q*uRes/(2.*uDpr)));
  sky+=step(1.-P.starDensity,st)*(.5+.5*sin(t*P.twinkle+st*90.))*vec3(.7);
  vec4 L=logoAt(q);
  float Lr=logoAt(q+off*P.chroma).r, Lb=logoAt(q-off*P.chroma).b;
  vec3 above=sky*(1.-L.a)+vec3(Lr,L.g,Lb)*P.markTint;
  vec2 mp=vec2((uMoon.x-.5)*asp, uMoon.y-.5);
  vec2 dp=p-mp; float md=length(dp); float a=atan(dp.y,dp.x);
  float rays=pow(fbm3(vec2(a*P.rayFreq+t*.03, md*1.6-t*.12)),P.raySharp)*exp(-md*P.rayFalloff)*uX.y;
  vec3 under=P.underCol*uBgTint+pow(caus(p*3.+g*.3,t*.7),2.)*LITE*P.underCaus*uLightK;
  vec3 col=mix(under, above, win);
  col+=LITE*rays*P.rayAmt*uLightK*(.4+.6*win);
  col+=LITE*exp(-md*P.moonGlowFalloff)*P.moonGlow*uLightK;
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  col+=pow(max(dot(n,normalize(vec3(-dp,P.glintHeight))),0.),P.glintSharp)*P.glintCol*P.glintAmt*uLightK;
  vec2 pp=p*vec2(9.,7.)-vec2(0.,t*.12);
  vec2 ci=floor(pp), cf=fract(pp);
  float h=hash(ci);
  vec2 o=vec2(hash(ci+1.7),hash(ci+3.1))*.8+.1+.07*sin(t*.5+h*20.+vec2(0.,1.6));
  col+=(1.-smoothstep(0.,P.moteSize,length(cf-o)))*step(1.-P.moteDensity,h)*LITE*(.1+.1*sin(t+h*40.))*uX.z;
  col=mix(col, P.edgeFogCol*uBgTint, smoothstep(.6,1.4,length(p))*uX.w);
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 08 Mist — a lake at dawn; the mark and its reflection soften into drifting fog at the horizon. */
FS.mist = `
vec3 sky(float y){
  float hz=uHz; float s=clamp((y-hz)/(1.-hz),0.,1.);
  vec3 lo=mix(P.skyCool, P.skyWarm, uX.w);
  return mix(lo,P.skyHigh,pow(s,P.skyCurve))*uBgTint;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float asp=uRes.x/uRes.y, hz=uHz, t=uTime;
  vec3 col;
  if(uv.y>hz){
    vec4 L=logoAt(uv);
    col=sky(uv.y)*(1.-L.a)+L.rgb;
  } else {
    float d=(hz-uv.y)/hz;
    float z=1./(d+P.persp);
    float X=(uv.x-.5)*asp*z;
    vec2 wp=vec2(X*1.2, z*1.4)*P.waveScale+vec2(0.,t*.25*P.waveFlow);
    vec2 ws=vec2(1.,P.waveStretch);
    float n1=fbm3(wp*ws), n2=fbm3(wp*ws+vec2(7.3,2.1)-t*.1*P.waveFlow);
    float amp=(.15+d*.6)*uWave;
    float ox=(n1-.5)*P.sway*amp, oy=(n2-.5)*P.bob*amp;
    float ry=2.*hz-uv.y;
    vec4 R=vec4(0.);
    float jt=hash(gl_FragCoord.xy*.37)-.5;
    for(int k=-2;k<=2;k++) R+=logoAt(vec2(uv.x+ox, ry+oy+(float(k)+jt)*.005*(.3+d)*uX.z));
    R/=5.;
    vec3 refl=sky(ry+oy)*(1.-R.a)+R.rgb;
    vec3 water=mix(P.waterFar, P.waterNear, d)*uBgTint;
    float fres=mix(P.reflFar,P.reflNear,d);
    col=mix(water, refl*P.reflTint, fres);
    col+=P.sparkleCol*pow(noise(vec2(X*34.,z*44.-t*.9)),P.sparkleSharp)*P.sparkleAmt*(.3+d)*uLightK*uLightCol;
  }
  vec2 mpos=vec2(uv.x*asp*P.mistScale+t*.03*P.mistDrift, uv.y*5.);
  float m=fbm(mpos+vec2(0.,t*.02*P.mistDrift))*.6+fbm(vec2(uv.x*asp*4.-t*.05*P.mistDrift,uv.y*9.))*.4;
  float band=exp(-abs(uv.y-hz)*(5.+9.*uX.y))*uX.x;
  float fog=clamp(band*(.5+m*.9),0.,1.);
  col=mix(col,P.mistCol*uBgTint,fog*P.mistOpacity);
  col*=.95+.05*vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 09 Lagoon — the mark floats on clear water and throws a wave-bent shadow onto the sand below. */
FS.lagoon = `
float H(vec2 p){ return fbm3(p*P.wave1Scale+vec2(uTime*.1,uTime*.06)*P.drift) + fbm3(p*P.wave2Scale-vec2(uTime*.07,0.)*P.drift)*P.wave2Amt + dropH(p,.3,P.ringFreq)*P.ringAmp; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=2./uRes.y, t=uTime;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e)*uWave;
  vec2 off=g*P.refract;
  vec2 fp=p-off;
  float rip=sin((fp.x*18.+fp.y*4.)*P.rippleScale+fbm3(fp*2.2)*7.)*.5+.5;
  vec3 sand=P.sandCol*(1.-rip*P.rippleDepth)+(noise(fp*140.)-.5)*P.sandGrain;
  sand=mix(sand, P.waterCol, smoothstep(.2,1.2,length(fp*vec2(.8,1.3))+fbm3(fp*1.5)*.5-.35)*P.waterAmt);
  vec2 so=-uLightDir.xy*uX.x*.08;
  float sh=softA(pToUv(fp+so+g*.004), .004+.012*uX.y);
  sand*=1.-sh*P.shadowDark;
  float c=pow(caus(fp*2.8*uX.z+g*P.causWarp,t*.85*P.causSpeed),P.causSharp1)*P.caus1 + pow(caus(fp*4.6*uX.z+7.,t*1.05*P.causSpeed),P.causSharp2)*P.caus2;
  sand+=c*P.causCol*P.causAmt*uLightK*uLightCol;
  sand*=uBgTint;
  vec4 L=logoAt(pToUv(p));
  vec3 col=sand*(1.-L.a)+L.rgb;
  vec3 n=normalize(vec3(-g*P.glintSlope,1.));
  col+=pow(max(dot(n,uLightDir),0.),P.glintSharp)*P.glintCol*P.glintAmt*uX.w*uLightK*uLightCol;
  col*=.94+.06*vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

/* 10–13 Sunrise, Noon, Sunset, Moonrise — Sunken moon through the day. The mark floats over the sand with its O
   shining under the water, haloed in it and glittering up through the waves; above, a sun or moon placed by the light
   direction lights the shallows: caustics and the mark's shadow on the sand, a glade on the water, a disc in the sky.
   Camera sits CAMH above the water with focal length FOCAL; the horizon slider sets its downward pitch. The mark is a
   vertical panel PH tall at distance uX.x, the top of its ink (uBox top) P.logoDepth below the surface; the floor lies
   uX.y deep. M is the height of its baseline (uBox bottom). */
FS.sunken = `
#define CAMH P.camH
#define FOCAL P.focal
#define PH P.markH
vec3 B, BW, SL, OL, MO; float MR, Z, D, M;
float W(vec2 x, float lod){
  float t=uTime;
  float h=sin(dot(x,vec2(.28,.96))*1.7-t*1.3)*.45+sin(dot(x,vec2(-.6,.8))*2.6-t*1.7)*.25;
  h+=(fbm3(x*vec2(1.1,1.6)+vec2(t*.12,-t*.35))-.5)*1.4;
  h+=(noise(x*vec2(4.,6.)+vec2(-t*.5,-t*.9))-.5)*.6*(1.-lod);
  return h*(1.-lod*.7);
}
vec3 sky(vec3 d){
  float y=max(d.y,0.);
  vec3 c=mix(P.skyLow, P.skyHigh, pow(min(y*P.skyGrad,1.),P.skyCurve));
  // the low sky warms toward the sun's side
  float tw=max(.5+.5*dot(normalize(d.xz+1e-5), normalize(B.xz+1e-5)),0.);
  c=(c+P.duskCol*P.duskAmt*exp(-y*P.duskFalloff)*pow(tw,P.duskFocus))*uBgTint;
  float a=acos(clamp(dot(d,B),-1.,1.));
  float mare=smoothstep(.4,.65,fbm3((d.xy-B.xy)/P.bodySize*1.5+3.1))*P.mare;
  return c+P.bodyCol*SL*(exp(-a*P.bodyGlowFalloff)*P.bodyGlow+smoothstep(P.bodySize,P.bodySize*.8,a)*P.bodyBright*(1.-mare));
}
vec2 plUv(vec3 q){ return vec2(q.x/(PH*uRes.x/uRes.y)+.5, uBox.y+(q.y-M)/PH); }
vec3 seaFloor(vec3 F, float lod){
  float t=uTime; vec2 x=F.xz;
  float rip=sin(x.x*2.+x.y*8.+fbm3(x*1.3)*6.)*.5+.5;
  vec3 sand=P.sandCol*(1.-rip*P.sandRipple*(1.-lod))*(.86+.28*fbm3(x*.6));
  float w=fbm3(x*.6+vec2(t*.05,t*.1));
  vec2 wp=vec2(fbm3(x*1.2+vec2(0.,t*.12)), fbm3(x*1.2+vec2(5.2,1.3-t*.1)))-.5;
  float c=pow(caus(x*2.2*P.causScale+wp*1.6+w,t*.9*P.causSpeed),3.)*.7+pow(caus(x*3.4*P.causScale+vec2(3.1,7.7)-wp*1.2-w,t*1.1*P.causSpeed),3.)*.3;
  c*=.45+1.1*fbm3(x*.45-vec2(t*.04,0.));
  c=mix(c,.12,lod);
  // the mark blocks the (refracted) sun or moon: its shadow lands on the sand
  float s=(Z-F.z)/BW.z, sh=0.;
  vec3 Qs=F+BW*s;
  if(s>0. && Qs.y<0.) sh=softA(plUv(Qs), .002+s*.006);
  // the O shines down on the sand too; the other letters share its plane, so they throw it no shadow
  vec3 d=MO-F; float r2=dot(d,d);
  float lam=max(d.y,0.)*inversesqrt(r2);
  return sand*(P.floorAmb*uBgTint+SL*(P.floorSun+c*P.causAmt)*(1.-sh*P.shadowDark)
              +OL*lam*P.floorLight*exp(-P.absorb*sqrt(r2)/uX.z)/(1.+(r2+.15)*P.lightFalloff*3.));
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float t=uTime; Z=uX.x; D=uX.y; M=-P.logoDepth-uBox.w*PH;
  B=normalize(vec3(uLightDir.x,uLightDir.z,uLightDir.y));
  BW=-refract(-B,vec3(0.,1.,0.),.75);
  SL=uLightK*uLightCol; OL=P.oCol*P.oLight;
  MO=vec3((uMoon.x-.5)*PH*uRes.x/uRes.y, (uMoon.y-uBox.y)*PH+M, Z); MR=uMoon.z*PH;
  float th=atan((uHz-.5)/FOCAL);
  vec3 fw=vec3(0.,-sin(th),cos(th)), up=vec3(0.,cos(th),sin(th));
  vec3 rd=normalize(vec3(p.x,0.,0.)+up*p.y+fw*FOCAL);
  vec3 col;
  if(rd.y>=0.){
    col=sky(rd);
    float st=hash(floor(gl_FragCoord.xy/(2.*uDpr)));
    col+=step(1.-P.starDensity,st)*(.55+.45*sin(t*P.twinkle+st*90.))*vec3(.8,.84,.95)*smoothstep(0.,.06,rd.y);
    float az=atan(rd.x,rd.z);
    float hh=.003+.016*pow(fbm3(vec2(az*4.,3.7)),1.6);
    col=mix(col, P.landCol, P.landAmt*smoothstep(hh, hh-.0015, rd.y));
  } else {
    float ts=CAMH/-rd.y;
    vec3 S=vec3(0.,CAMH,0.)+rd*ts;
    float pix=ts/(uRes.y*FOCAL*max(-rd.y,.02));
    float lod=smoothstep(.01,.08,pix);
    float e=.03;
    vec2 g=vec2(W(S.xz+vec2(e,0.),lod)-W(S.xz-vec2(e,0.),lod), W(S.xz+vec2(0.,e),lod)-W(S.xz-vec2(0.,e),lod))/(2.*e);
    g*=.02*uWave;
    vec3 n=normalize(vec3(-g.x,1.,-g.y));
    // softened refraction: a little steeper, bent by the wave slope
    vec3 rw=normalize(rd*vec3(1.,P.steepen,1.)+vec3(g.x,0.,g.y)*P.bend);
    float tf=D/-rw.y;
    vec3 F=S+rw*tf;
    float pf=(ts+tf)/(uRes.y*FOCAL*max(-rw.y,.02))*2.;
    vec3 ab=P.absorb/uX.z;
    vec3 scat=P.scatCol*uBgTint*(.4+.6*uLightK);
    vec3 Tf=exp(-ab*tf);
    vec3 under=seaFloor(F,smoothstep(.01,.12,pf))*Tf+scat*(1.-Tf);
    float tl=(Z-S.z)/rw.z;
    if(rw.z>0. && tl>0. && tl<tf){
      vec3 Q=S+rw*tl;
      vec2 q=plUv(Q);
      vec4 L=logoAt(q);
      float dm=length(Q.xy-MO.xy);
      float lc=pow(caus(Q.xy*1.8+g*3.+vec2(0.,t*.05),t*.8),2.);
      // the O is the moon: it shines; the letters glow faintly and catch its light edge-on. Both take the light from above.
      vec3 above=SL*(P.markSun*max(-BW.z,0.)+lc*P.markCaus);
      vec3 Lc=L.rgb*(P.markAmb*uBgTint+P.inkGlow+OL*P.markLight/(1.+dm*dm*P.lightFalloff*P.markFalloff)+above);
      Lc=mix(Lc, L.rgb*(OL*P.oBright+above), smoothstep(MR*1.03,MR*.9,dm));
      vec3 Tl=exp(-ab*tl);
      under=under*(1.-L.a)+Lc*Tl+scat*(1.-Tl)*L.a;
      under+=softA(q,P.haloSize)*(1.-L.a)*OL*P.wordHalo*Tl;
    }
    // the O's light scattered in the water around it, wavering with the refraction above
    float tc=clamp(dot(MO-S,rw),0.,tf);
    float dc=length(S+rw*tc-MO);
    vec3 Tc=exp(-ab*(tc+dc));
    under+=OL*Tc*(P.haloAmt*exp(-max(dc-MR,0.)/P.haloSize)+P.glowAmt/(1.+dc*dc*P.glowFalloff))*uX.w;
    vec3 rr=reflect(rd,n); rr.y=abs(rr.y);
    float fr=.02+.98*pow(1.-max(dot(-rd,n),0.),5.);
    col=mix(under,sky(rr),fr);
    float sp=pow(noise(S.xz*vec2(9.,14.)*P.glitterScale-vec2(0.,t*1.2)),P.glitterSharp)*(1.-lod*.6);
    // the O's light breaking through the surface above it as glitter
    vec3 vs=MO-S; float r2=dot(vs,vs);
    col+=OL*(-MO.y)*inversesqrt(r2)/(1.+r2*P.surfFalloff)*exp(-ab*sqrt(r2))*(P.surfGlow+sp*P.glitterAmt)*(1.-fr)*uX.w;
    // the glade: facets tilted to send the sun or moon to the eye, broken into glitter
    col+=P.glitterCol*SL*pow(max(dot(rr,B),0.),P.gladeSharp)*(P.gladeGlow+sp*P.glitterAmt)*(.25+fr);
    col=mix(col, sky(normalize(vec3(rd.x,.01,rd.z))), (1.-exp(-ts*.008))*P.haze);
  }
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

const asScene =src => src.replace(/gl_FragCoord/g, 'FC').replace(/gl_FragColor/g, 'OUT').replace('void main()', 'void scene()');

/* ---------- colour + matrix helpers ---------- */
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = a => '#' + a.slice(0, 3).map(v => Math.round(+v).toString(16).padStart(2, '0')).join('');
const rgb01 = h => hexRgb(h).map(v => v / 255);
const parseRGBA = s => { const m = s.match(/[\d.]+/g).map(Number); return { hex: rgbHex(m), a: m[3] ?? 1 }; };
const rgba = (hex, a) => `rgba(${hexRgb(hex).join(',')},${a})`;
const RAD = Math.PI / 180;

// The shaders keep their own background shading and multiply it by uBgTint, so a chosen
// background colour becomes its ratio to the scene's reference colour (1 at the default).
function deriveFx(f, view) {
  const az = f.lightAz * RAD, el = f.lightEl * RAD, r0 = rgb01(view.bg);
  return {
    lightDir: [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)],
    lightCol: rgb01(f.lightCol), bg: rgb01(f.bg).map((v, i) => v / Math.max(r0[i], 1 / 255) * f.bgBright),
    tint: rgb01(f.tint), x: [f.x0, f.x1, f.x2, f.x3], hue: f.hue * RAD,
    adv: advParams(view).map(a => a.color ? rgb01(f['p_' + a.k]) : f['p_' + a.k]),
  };
}

// Advanced parameters: each one is a field of the shader's uniform struct P (read as P.<k>)
// and a 'p_<k>' entry in the scene state. Strings in a view's adv list are panel subheadings.
const advParams = view => (view.adv || []).filter(a => typeof a !== 'string');
const advDecl = view => {
  const ps = advParams(view);
  return ps.length ? `struct Params{${ps.map(a => `${a.color ? 'vec3' : 'float'} ${a.k};`).join('')}};\nuniform Params P;\n` : '';
};

// Screen point (0..1, y down) → scene uv (y up), matching the shader's zoom/pan mapping.
function screenToScene(x, y, asp, zoom, pan) {
  const qx = (x - .5) * asp / zoom + pan[0], qy = (.5 - y) / zoom + pan[1];
  return [qx / asp + .5, qy + .5];
}

function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function staticFallback(stage, logoOpts, bg) {
  const cv = stage.querySelector('canvas'), ctx = cv.getContext('2d');
  let opts = logoOpts;
  const draw = () => {
    const w = Math.round(cv.clientWidth * DPR), h = Math.round(cv.clientHeight * DPR);
    cv.width = w; cv.height = h;
    ctx.fillStyle = bg || '#070a14'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(makeLogo(w, h, opts).canvas, 0, 0);
  };
  watchResize(cv, draw);
  return { setLogo(o) { opts = o; loadFonts(o).then(draw); draw(); }, setFx() {} };
}

function glView(view) {
  const { id } = view;
  const stage = document.getElementById(id), cv = stage.querySelector('canvas');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  let logoOpts = view.logo, fx = view.fx, D = deriveFx(fx, view);
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, PRELUDE + advDecl(view) + asScene(view.frag) + POST));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (err) {
    console.error(id, err);
    return staticFallback(stage, logoOpts, fx.bg);
  }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const u = {};
  for (const n of ['uTex', 'uRes', 'uTime', 'uDpr', 'uDrops', 'uMouse', 'uMoon', 'uBox', 'uLightK', 'uWave', 'uVig', 'uHz', 'uLightDir', 'uLightCol', 'uBgTint', 'uX',
                   'uZoom', 'uExposure', 'uContrast', 'uSat', 'uHue', 'uGrain', 'uPan', 'uTint'])
    u[n] = gl.getUniformLocation(prog, n);
  const advU = advParams(view).map(a => ({ color: a.color, loc: gl.getUniformLocation(prog, 'P.' + a.k) }));
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);

  const drops = new Float32Array(32);
  for (let i = 0; i < 8; i++) drops[i * 4 + 2] = -1e3;
  let di = 0, moon = [.5, .5, .05], box = [0, 0, 1, 1], mouse = [.5, .5, 0], nextDrop = 1.2, lastMove = 0;
  // Scene clock advances by fx.speed so changing speed never jumps the animation.
  let simT = 0, lastT = performance.now();
  const now = () => REDUCED ? 6 : simT;
  const addDrop = (x, y, s) => { drops.set([x, y, now(), s * fx.dropSize], di * 4); di = (di + 1) % 8; };

  let v;
  const buildLogo = () => {
    const w = cv.width, h = cv.height;
    const L = makeLogo(w, h, logoOpts);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, L.canvas);
    moon = [L.moon.x / w, 1 - L.moon.y / h, L.moon.r / h];
    box = [L.box.x / w, 1 - (L.box.y + L.box.h) / h, L.box.w / w, L.box.h / h];
    if (v) v.needs = true;
  };
  let logoQueued = false;
  const queueLogo = () => { if (!logoQueued) { logoQueued = true; requestAnimationFrame(() => { logoQueued = false; buildLogo(); }); } };

  watchResize(cv, () => {
    let w = cv.clientWidth * DPR, h = cv.clientHeight * DPR;
    const sc = Math.min(1, (maxTex - 16) / Math.max(w, h));
    w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
    cv.width = w; cv.height = h; gl.viewport(0, 0, w, h);
    buildLogo();
  });

  const toScene = e => { const [x, y] = rel(e, stage); return screenToScene(x, y, cv.width / cv.height, fx.zoom, [fx.panX, fx.panY]); };
  if (view.interactive && !REDUCED) {
    stage.addEventListener('pointermove', e => {
      const s = toScene(e);
      mouse = [s[0], s[1], 1];
      const t = now();
      if (e.buttons || t - lastMove > .14) { addDrop(s[0], s[1], e.buttons ? .7 : .3); lastMove = t; }
    });
    stage.addEventListener('pointerdown', e => { const s = toScene(e); addDrop(s[0], s[1], 1.3); });
    stage.addEventListener('pointerleave', () => { mouse[2] = 0; });
  }
  if (REDUCED && view.rain) { addDrop(.42, .45, 1); drops[2] = 4.2; }

  v = register(stage, () => {
    const n = performance.now();
    simT += Math.min(.1, (n - lastT) / 1000) * fx.speed; lastT = n;
    const t = now();
    if (view.rain && fx.rain && !REDUCED && t > nextDrop) {
      const b = view.rainBox || [.18, .22, .82, .78];
      addDrop(b[0] + Math.random() * (b[2] - b[0]), b[1] + Math.random() * (b[3] - b[1]), .8 + Math.random() * .5);
      nextDrop = t + (1.6 + Math.random() * 1.8) / fx.rainRate;
    }
    gl.uniform1i(u.uTex, 0);
    gl.uniform2f(u.uRes, cv.width, cv.height);
    gl.uniform1f(u.uTime, t);
    gl.uniform1f(u.uDpr, cv.width / Math.max(1, cv.clientWidth));
    gl.uniform4fv(u.uDrops, drops);
    gl.uniform3fv(u.uMouse, mouse);
    gl.uniform3fv(u.uMoon, moon);
    gl.uniform4fv(u.uBox, box);
    gl.uniform1f(u.uLightK, fx.light);
    gl.uniform1f(u.uWave, fx.wave);
    gl.uniform1f(u.uVig, fx.vig);
    gl.uniform1f(u.uHz, fx.hz ?? .5);
    gl.uniform3fv(u.uLightDir, D.lightDir);
    gl.uniform3fv(u.uLightCol, D.lightCol);
    gl.uniform3fv(u.uBgTint, D.bg);
    gl.uniform4fv(u.uX, D.x);
    gl.uniform1f(u.uZoom, fx.zoom);
    gl.uniform2f(u.uPan, fx.panX, fx.panY);
    gl.uniform1f(u.uExposure, fx.exposure);
    gl.uniform1f(u.uContrast, fx.contrast);
    gl.uniform1f(u.uSat, fx.sat);
    gl.uniform1f(u.uHue, D.hue);
    gl.uniform1f(u.uGrain, fx.grain);
    gl.uniform3fv(u.uTint, D.tint);
    advU.forEach((a, i) => a.color ? gl.uniform3fv(a.loc, D.adv[i]) : gl.uniform1f(a.loc, D.adv[i]));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });

  return {
    setLogo(o) { logoOpts = o; queueLogo(); loadFonts(o).then(queueLogo); },
    setFx(f) { fx = f; D = deriveFx(f, view); v.needs = true; },
  };
}

/* ---------- view definitions ---------- */
const FX_BASE = {
  light: 1, lightCol: '#ffffff', lightAz: 120, lightEl: 60, bgBright: 1,
  zoom: 1, panX: 0, panY: 0,
  speed: 1, wave: 1,
  exposure: 1, contrast: 1, sat: 1, hue: 0, tint: '#ffffff', vig: 1, grain: 0,
};
// Advanced parameter rows: P = slider, PC = colour (given as 0..1 rgb, as in the shader).
const P = (k, label, def, min, max, step) => ({ k, label, def, min, max, step });
const PC = (k, label, c) => ({ k, label, def: rgbHex(c.map(v => v * 255)), color: true });
const WAVES2 = (s1, s2, a2, refract) => ['Waves',
  P('wave1Scale', 'Layer 1 scale', s1, .2, 10, .05), P('wave2Scale', 'Layer 2 scale', s2, .2, 12, .05),
  P('wave2Amt', 'Layer 2 height', a2, 0, 1.5, .01), P('drift', 'Drift', 1, 0, 4, .01), P('refract', 'Refraction', refract, 0, .03, .0005)];
const RINGS = (freq, amp) => [P('ringFreq', 'Ring freq', freq, 10, 120, 1), P('ringAmp', 'Ring height', amp, 0, .2, .001)];
const GLINT = (slope, sharp, amt, col) => ['Surface glint',
  P('glintSlope', 'Wave tilt', slope, 0, 3, .01), P('glintSharp', 'Sharpness', sharp, 2, 400, 1),
  P('glintAmt', 'Strength', amt, 0, 2, .01), PC('glintCol', 'Colour', col)];
const CAUS = (amt, col, c1, c2, s1, s2, warp) => ['Caustics',
  P('causAmt', 'Strength', amt, 0, 2, .01), PC('causCol', 'Colour', col),
  P('caus1', 'Layer 1', c1, 0, 2, .01), P('caus2', 'Layer 2', c2, 0, 2, .01),
  P('causSharp1', 'Layer 1 sharp', s1, .5, 8, .05), P('causSharp2', 'Layer 2 sharp', s2, .5, 8, .05),
  P('causSpeed', 'Speed', 1, 0, 4, .01), P('causWarp', 'Wave warp', warp, 0, .5, .005)];
const SHADOW = (offset, blur) => ['Shadow', P('shadowOffset', 'Offset', offset, 0, .15, .001), P('shadowBlur', 'Blur', blur, 0, .04, .0005)];
const SHEEN = (sharp, height, amt, col) => [P('sheenSharp', 'Sheen sharp', sharp, 2, 200, 1), P('sheenHeight', 'Moon height', height, .05, 1, .01),
  P('sheenAmt', 'Sheen', amt, 0, 3, .01), PC('sheenCol', 'Sheen colour', col)];
const MOTES = (density, size) => ['Motes', P('moteDensity', 'Density', density, 0, 1, .01), P('moteSize', 'Size', size, .005, .2, .001)];
const OPEN_WATER = (persp, sway, bob) => ['Waves',
  P('persp', 'Perspective', persp, .01, .4, .005), P('waveScale', 'Scale', 1, .2, 4, .01), P('waveStretch', 'Stretch', 3, .5, 8, .05),

  const g1 = parseRGBA(o.glow), g2 = parseRGBA(o.glow2);
  return {
    word: o.word, studio: o.studio, mode: o.mode,
    font: famKey(o.font), weight: o.weight, italic: o.style === 'italic', upper: o.upper, track: o.track,
    fill: o.fill, maxH: o.maxH, yShift: o.yShift,
    sFont: o.sFont ? famKey(o.sFont) : 'same', sWeight: o.sWeight, sItalic: o.sStyle === 'italic', sUpper: o.sUpper,
    sSize: o.sSize, sTrack: o.sTrack, sGap: o.sGap, sAlign: o.sAlign,
    ink: o.ink, sInk: o.sInk || o.ink,
    glow: g1.hex, glowA: g1.a, glowSize: o.glowSize, glow2: g2.hex, glow2A: g2.a, glow2Size: o.glow2Size,
    haloCol: rgbHex(o.haloRGB.split(',')), halo: o.halo,
    moonScale: o.moonScale, moonGap: o.moonGap, moonHalo: o.moonHalo, flatMoon: o.flatMoon,
    moonLight: o.moon.light, moonMid: o.moon.mid, moonEdge: o.moon.edge, mare: o.moon.mare, box: o.box,
  };
}
function logoOpts(u) {
  return {
    word: u.word || ' ', studio: u.studio, mode: u.mode,
    font: F[u.font], weight: u.weight, style: u.italic ? 'italic' : 'normal', upper: u.upper, track: u.track,
    fill: u.fill, maxH: u.maxH, yShift: u.yShift, box: u.box,
    sFont: u.sFont === 'same' ? null : F[u.sFont], sWeight: u.sWeight, sStyle: u.sItalic ? 'italic' : 'normal', sUpper: u.sUpper,
    sSize: u.sSize, sTrack: u.sTrack, sGap: u.sGap, sAlign: u.sAlign,
    ink: u.ink, sInk: u.sInk,
    glow: rgba(u.glow, u.glowA), glowSize: u.glowSize, glow2: rgba(u.glow2, u.glow2A), glow2Size: u.glow2Size,
    halo: u.halo, haloRGB: hexRgb(u.haloCol).join(','),
    moonScale: u.moonScale, moonGap: u.moonGap, moonHalo: u.moonHalo, flatMoon: u.flatMoon,
    moon: { light: u.moonLight, mid: u.moonMid, edge: u.moonEdge, mare: u.mare },
  };
}

/* ---------- control panels ---------- */
const R = (k, label, min, max, step, unit = '') => ({ k, label, type: 'range', min, max, step, unit });
const C = (k, label) => ({ k, label, type: 'color' });
const T = (k, label) => ({ k, label, type: 'toggle' });
const S = (k, label, options) => ({ k, label, type: 'select', options });
const X = (k, label) => ({ k, label, type: 'text' });
const FONTS = Object.entries(FONT_NAMES);
const ALIGN = [['start', 'Left'], ['center', 'Centre'], ['end', 'Right']];

function groupsFor(v) {
  const groups = [
    { title: 'Colour & glow', target: 'logo', rows: [
      C('ink', 'Word colour'), C('sInk', 'Studio colour'),
      C('glow', 'Bloom'), R('glowA', 'Bloom opacity', 0, 1, .01), R('glowSize', 'Bloom size', 0, .8, .005),
      C('glow2', 'Edge glow'), R('glow2A', 'Edge opacity', 0, 1, .01), R('glow2Size', 'Edge size', 0, .3, .005),
      C('haloCol', 'Halo'), R('halo', 'Halo strength', 0, .8, .01),
    ] },
    { title: 'Lighting', target: 'fx', rows: [
      R('light', 'Intensity', 0, 3, .01), C('lightCol', 'Light colour'),
      ...(v.lightDir ? [R('lightAz', 'Azimuth', -180, 180, 1, '°'), R('lightEl', 'Elevation', 0, 90, .5, '°')] : []),
      C('bg', 'Background'), R('bgBright', 'Background level', 0, 3, .01),
      R('exposure', 'Exposure', 0, 3, .01),
    ] },
    { title: 'Framing', target: 'fx', rows: [
      R('zoom', 'Zoom', .3, 4, .01),
      R('panX', 'Pan X', -1, 1, .005), R('panY', 'Pan Y', -1, 1, .005),
      ...(v.hz != null ? [R('hz', 'Horizon', 0, 1, .005)] : []),
    ] },
    { title: 'Wordmark', target: 'logo', rows: [
      X('word', 'Word'), S('font', 'Font', FONTS), R('weight', 'Weight', 100, 900, 100),
      T('italic', 'Italic'), T('upper', 'Uppercase'), R('track', 'Tracking', -.1, .5, .005),
      R('fill', 'Size', .2, 1, .01), R('maxH', 'Max height', .15, 1, .01), R('yShift', 'Vertical', -.4, .4, .005),
    ] },
    { title: 'Studio line', target: 'logo', rows: [
      X('studio', 'Text'), S('mode', 'Placement', [['above', 'Above'], ['below', 'Below'], ['inline', 'Inline'], ['none', 'Hidden']]),
      S('sFont', 'Font', [['same', 'Same as word'], ...FONTS]), R('sWeight', 'Weight', 100, 900, 100),
      T('sItalic', 'Italic'), T('sUpper', 'Uppercase'), R('sSize', 'Size', .05, .5, .005),
      R('sTrack', 'Tracking', 0, 2, .01), R('sGap', 'Gap', -.1, .6, .005), S('sAlign', 'Align', ALIGN),
    ] },
    { title: 'Moon', target: 'logo', rows: [
      R('moonScale', 'Scale', .4, 2, .01), R('moonGap', 'Spacing', -.05, .2, .002), R('moonHalo', 'Halo', 0, 1.5, .01),
      T('flatMoon', 'Flat'), C('moonLight', 'Highlight'), C('moonMid', 'Body'), C('moonEdge', 'Limb'),
    ] },
    { title: 'Water & motion', target: 'fx', rows: [
      R('speed', 'Speed', 0, 3, .01), R('wave', 'Waves', 0, 4, .01),
      ...v.extras.map(([label, , min, max, step], i) => R('x' + i, label, min, max, step)),
      ...(v.rain ? [T('rain', 'Rain'), R('rainRate', 'Rain rate', .2, 5, .01), R('dropSize', 'Drop size', 0, 3, .01)] : []),
    ], hint: v.interactive ? 'Move or click on the water to make ripples.' : '' },
    { title: 'Finish', target: 'fx', rows: [
      R('contrast', 'Contrast', .3, 2.5, .01), R('sat', 'Saturation', 0, 2.5, .01), R('hue', 'Hue', -180, 180, 1, '°'),
      C('tint', 'Grade'), R('vig', 'Vignette', 0, 3, .01), R('grain', 'Grain', 0, 1, .01),
    ] },
    ...(v.adv ? [{ title: 'Advanced', target: 'fx', intro: 'The shader’s own constants. Double-click a label to reset it.', rows: v.adv.map(a =>
      typeof a === 'string' ? { type: 'head', label: a } : a.color ? C('p_' + a.k, a.label) : R('p_' + a.k, a.label, a.min, a.max, a.step)) }] : []),
  ];
  // v.frame: keys pulled out of their own groups into Framing.
  const framing = groups.find(g => g.title === 'Framing');
  for (const k of v.frame || []) for (const g of groups) {
    const i = g.rows.findIndex(r => r.k === k);
    if (i >= 0 && g !== framing) framing.rows.push(...g.rows.splice(i, 1));
  }
  return groups;
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const diff = (a, d) => Object.fromEntries(Object.entries(a).filter(([k, v]) => JSON.stringify(v) !== JSON.stringify(d[k])));
const decimals = step => Math.max(0, -Math.floor(Math.log10(step) + 1e-9));

function buildPanel(view) {
  const defs = {
    logo: logoUI(CFG[view.key]),
    fx: { ...FX_BASE, bg: view.bg, ...(view.fx0 || {}), ...(view.hz != null ? { hz: view.hz } : {}),
          ...Object.fromEntries(view.extras.map(([, d], i) => ['x' + i, d])),
          ...Object.fromEntries(advParams(view).map(a => ['p_' + a.k, a.def])),
          ...(view.rain ? { rain: true, rainRate: 1, dropSize: 1 } : {}) },
  };
  const key = 'citron:controls:' + view.id;
  const saved = store.get(key) || {};
  const known = (o, d) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => k in d));
  const st = { logo: { ...defs.logo, ...known(saved.logo, defs.logo) }, fx: { ...defs.fx, ...known(saved.fx, defs.fx) } };

  view.logo = logoOpts(st.logo); view.fx = { ...st.fx };
  const ctl = glView(view);

  const panel = document.createElement('aside');
  panel.className = 'panel';
  panel.setAttribute('aria-label', `${view.name} controls`);
  const head = document.createElement('header');
  head.innerHTML = `<b>${view.name}</b><button type="button" data-a="copy" title="Copy changed settings as JSON">Copy</button><button type="button" data-a="reset">Reset</button>`;
  panel.append(head);

  const fields = [];
  const commit = target => {
    if (target === 'logo') ctl.setLogo(logoOpts(st.logo)); else ctl.setFx({ ...st.fx });
    store.set(key, { logo: diff(st.logo, defs.logo), fx: diff(st.fx, defs.fx) });
  };
  const sync = f => {
    const val = st[f.target][f.r.k];
    if (f.r.type === 'toggle') f.input.checked = val; else f.input.value = val;
    if (f.out) f.out.textContent = (+val).toFixed(decimals(f.r.step)) + f.r.unit;
    f.row.classList.toggle('changed', JSON.stringify(val) !== JSON.stringify(defs[f.target][f.r.k]));
  };

  for (const g of groupsFor(view)) {
    const det = document.createElement('details');
    det.innerHTML = `<summary>${g.title}</summary>`;
    if (g.intro) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = g.intro; det.append(h); }
    for (const r of g.rows) {
      if (r.type === 'head') { const h = document.createElement('div'); h.className = 'sub'; h.textContent = r.label; det.append(h); continue; }
      const row = document.createElement('label');
      row.className = 'row' + (r.type === 'range' ? '' : ' wide');
      const lab = document.createElement('span');
      lab.className = 'lab'; lab.textContent = r.label; row.title = `${r.label} — right-click to reset`;
      let input, out;
      if (r.type === 'select') {
        input = document.createElement('select');
        for (const [v, n] of r.options) input.add(new Option(n, v));
      } else {
        input = document.createElement('input');
        input.type = { range: 'range', color: 'color', toggle: 'checkbox', text: 'text' }[r.type];
        if (r.type === 'range') Object.assign(input, { min: r.min, max: r.max, step: r.step });
        if (r.type === 'text') input.spellcheck = false;
      }
      row.append(lab, input);
      if (r.type === 'range') { out = document.createElement('output'); row.append(out); }
      const f = { r, target: g.target, input, out, row };
      fields.push(f);
      input.addEventListener('input', () => {
        st[g.target][r.k] = r.type === 'toggle' ? input.checked : r.type === 'range' ? +input.value : input.value;
        sync(f); commit(g.target);
      });
      row.addEventListener('contextmenu', e => {
        if (r.type === 'text' && e.target === input) return; // keep the native copy/paste menu
        e.preventDefault();
        st[g.target][r.k] = defs[g.target][r.k];
        sync(f); commit(g.target);
      });
      sync(f);
      det.append(row);
    }
    if (g.hint) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = g.hint; det.append(h); }
    panel.append(det);
  }

  head.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'reset') {
      Object.assign(st.logo, defs.logo); Object.assign(st.fx, defs.fx);
      fields.forEach(sync); commit('logo'); commit('fx');
    } else {
      const text = JSON.stringify({ variant: view.name, logo: diff(st.logo, defs.logo), scene: diff(st.fx, defs.fx) }, null, 2);
      try { await navigator.clipboard.writeText(text); b.textContent = 'Copied'; }
      catch { console.log(text); b.textContent = 'In console'; }
      setTimeout(() => { b.textContent = 'Copy'; }, 1200);
    }
  });

  document.getElementById(view.id).after(panel);
}

/* ---------- page: one section per view, plus an index ---------- */
const main = document.querySelector('main');
const idx = document.createElement('nav'); idx.className = 'idx';
VIEWS.forEach((v, i) => {
  const nn = String(i + 1).padStart(2, '0');
  if (v.grp) { const h = document.createElement('div'); h.className = 'grp'; h.textContent = v.grp; main.append(h); }
  const s = document.createElement('section');
  s.className = 'opt' + (v.tall ? ' tall' : ''); s.id = 'o' + nn;
  s.innerHTML = `<div class="num"><span>${nn}</span><b>${v.name}</b>${v.parts ? `<i>${v.parts}</i>` : ''}</div>` +
    `<div class="opt-body"><div class="stage${v.interactive ? ' interactive' : ''}" id="${v.id}" role="img" aria-label="Studio citron"><canvas></canvas></div></div>`;
  main.append(s);
  const a = document.createElement('a'); a.href = '#o' + nn; a.innerHTML = `<span>${nn}</span>${v.name}`; idx.append(a);
});
main.prepend(idx);

/* ---------- start ---------- */
VIEWS.forEach(buildPanel);
requestAnimationFrame(loop);
})();
</script>
</body>
