<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio citron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Fraunces:opsz,wght@9..144,600&family=Italiana&family=Syne:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070b; --ink:#ece8d9; --muted:#8e8c85;
  --stage-h:clamp(300px,34vw,480px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:48px 0}

section.opt{margin:0 0 72px}
.num{max-width:1120px;margin:0 auto;padding:0 24px 14px;font:400 13px/1 Helvetica,"Helvetica Neue",Arial,sans-serif;color:var(--muted)}
.stage{position:relative;height:var(--stage-h);overflow:hidden;background:#000;touch-action:pan-y}
.stage.tall{--stage-h:clamp(380px,46vw,640px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.interactive{cursor:crosshair}
</style>
</head>
<body>

<main>

<section class="opt" id="o01">
  <div class="num">01</div>
  <div class="stage interactive" id="v01" role="img" aria-label="Studio citron"><canvas></canvas></div>
</section>

<section class="opt" id="o02">
  <div class="num">02</div>
  <div class="stage tall" id="v03" role="img" aria-label="Studio citron"><canvas></canvas></div>
</section>

<section class="opt" id="o03">
  <div class="num">03</div>
  <div class="stage" id="v05" role="img" aria-label="Studio citron"><canvas></canvas></div>
</section>

<section class="opt" id="o04">
  <div class="num">04</div>
  <div class="stage" id="v12" role="img" aria-label="Studio citron"><canvas></canvas></div>
</section>

<section class="opt" id="o05">
  <div class="num">05</div>
  <div class="stage tall" id="v14" role="img" aria-label="Studio citron"><canvas></canvas></div>
</section>

</main>

<script>
(async function(){
const TAU = Math.PI * 2;
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- wordmark renderer (canvas) ---------- */
const F = {
  corm: "'Cormorant Garamond', serif",
  fraun: "'Fraunces', serif",
  ital: "'Italiana', serif",
  syne: "'Syne', sans-serif",
};
const LOGO = {
  word: 'citron', studio: 'studio', mode: 'above',        // above | below | inline | none
  font: F.corm, weight: 300, style: 'normal', upper: false,
  sFont: null, sWeight: 500, sStyle: 'normal', sSize: .18, sTrack: .55, sGap: .14, sAlign: 'start', sUpper: true,
  ink: '#f4f0e0',
  glow: 'rgba(255,238,190,.6)', glowSize: .22,
  glow2: 'rgba(255,248,228,.75)', glow2Size: .045,
  halo: .11, haloRGB: '255,236,180',
  moon: { light: '#fffef6', mid: '#f2ecd2', edge: '#c9bd94', mare: '125,115,85' },
  moonScale: 1.12, moonGap: .035, moonHalo: .38, flatMoon: false,
  box: [0, 0, 1, 1], fill: .72, maxH: .56, yShift: .02,
};
const MARIA = [[-.28,-.18,.34,.22],[.22,-.3,.22,.18],[.12,.18,.36,.2],[-.3,.36,.18,.14],[.4,.12,.14,.12],[-.05,-.02,.12,.1]];
const fontStr = (size, weight, style, fam) => `${style} ${weight} ${size}px ${fam}`;

function drawMoon(c, x, y, r, m, flat) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  if (flat) { c.fill(); c.restore(); return; }
  const g = c.createRadialGradient(x - r * .32, y - r * .36, r * .05, x, y, r * 1.02);
  g.addColorStop(0, m.light); g.addColorStop(.55, m.mid); g.addColorStop(1, m.edge);
  c.fillStyle = g; c.fill(); c.clip();
  for (const [dx, dy, rr, a] of MARIA) {
    const cx = x + dx * r, cy = y + dy * r, R = rr * r;
    const gg = c.createRadialGradient(cx, cy, 0, cx, cy, R);
    gg.addColorStop(0, `rgba(${m.mare},${a})`); gg.addColorStop(.7, `rgba(${m.mare},${a * .5})`); gg.addColorStop(1, `rgba(${m.mare},0)`);
    c.fillStyle = gg; c.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  }
  c.restore();
}

function makeLogo(W, H, opts) {
  const o = { ...LOGO, ...opts, moon: { ...LOGO.moon, ...(opts.moon || {}) } };
  const sFont = o.sFont || o.font;
  const m = document.createElement('canvas').getContext('2d');
  const S = 100;
  const word = o.upper ? o.word.toUpperCase() : o.word;
  const mi = word.search(/o/i);
  const pre = word.slice(0, mi), post = word.slice(mi + 1);

  m.font = fontStr(S, o.weight, o.style, o.font);
  const xh = m.measureText(o.upper ? 'H' : 'x').actualBoundingBoxAscent;
  const D = xh * o.moonScale, gap = S * o.moonGap;
  const asc = Math.max(m.measureText(pre + post).actualBoundingBoxAscent, D);
  const wPre = m.measureText(pre).width, wPost = m.measureText(post).width;
  const wordW = wPre + gap * 2 + D + wPost;

  const st = o.sUpper ? o.studio.toUpperCase() : o.studio;
  const inline = o.mode === 'inline';
  const sSize = inline ? S : S * o.sSize;
  m.font = fontStr(sSize, o.sWeight, o.sStyle, sFont);
  const sTr = inline ? 0 : sSize * o.sTrack;
  const chars = [...st], cw = chars.map(ch => m.measureText(ch).width);
  const sW = inline ? m.measureText(st).width : cw.reduce((a, b) => a + b, 0) + sTr * (chars.length - 1);
  const sAsc = m.measureText(st).actualBoundingBoxAscent;
  const space = S * .26;

  let totalW, totalH;
  if (inline) { totalW = sW + space + wordW; totalH = Math.max(asc, sAsc); }
  else if (o.mode === 'none') { totalW = wordW; totalH = asc; }
  else { totalW = Math.max(wordW, sW); totalH = asc + sAsc + S * o.sGap; }

  const bx = o.box[0] * W, by = o.box[1] * H, bw = o.box[2] * W, bh = o.box[3] * H;
  const k = Math.min(bw * o.fill / totalW, bh * o.maxH / totalH);
  const x0 = bx + (bw - totalW * k) / 2, y0 = by + (bh - totalH * k) / 2 + o.yShift * bh;

  let wx = x0 + (totalW - wordW) * k / 2, base = y0 + totalH * k, sBase = base, sx = x0;
  if (inline) { wx = x0 + (sW + space) * k; }
  else if (o.mode === 'above') { sBase = y0 + sAsc * k; }
  else if (o.mode === 'below') { base = y0 + asc * k; sBase = y0 + totalH * k; }
  if (!inline) {
    sx = o.sAlign === 'center' ? x0 + (totalW - sW) * k / 2
       : o.sAlign === 'end' ? wx + wordW * k - sW * k
       : wx;
  }

  const ink = document.createElement('canvas'); ink.width = W; ink.height = H;
  const c = ink.getContext('2d');
  c.fillStyle = o.ink;
  c.font = fontStr(S * k, o.weight, o.style, o.font);
  c.fillText(pre, wx, base);
  const r = D * k / 2, mx = wx + (wPre + gap) * k + r, my = base - r + D * k * .012;
  drawMoon(c, mx, my, r, o.moon, o.flatMoon);
  c.fillText(post, wx + (wPre + gap * 2 + D) * k, base);
  if (o.mode !== 'none') {
    c.font = fontStr(sSize * k, o.sWeight, o.sStyle, sFont);
    if (inline) c.fillText(st, sx, sBase);
    else { let x = sx; chars.forEach((ch, i) => { c.fillText(ch, x, sBase); x += (cw[i] + sTr) * k; }); }
  }

  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const g = out.getContext('2d');
  if (o.halo > 0) {
    const cx = x0 + totalW * k / 2, cy = y0 + totalH * k / 2, R = totalW * k * .62;
    g.save(); g.translate(cx, cy); g.scale(1, .42);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, R);
    gr.addColorStop(0, `rgba(${o.haloRGB},${o.halo})`); gr.addColorStop(1, `rgba(${o.haloRGB},0)`);
    g.fillStyle = gr; g.fillRect(-R, -R, 2 * R, 2 * R); g.restore();
  }
  if (o.moonHalo > 0) {
    const gr = g.createRadialGradient(mx, my, r * .9, mx, my, r * 3.4);
    gr.addColorStop(0, `rgba(${o.haloRGB},${o.moonHalo})`); gr.addColorStop(1, `rgba(${o.haloRGB},0)`);
    g.fillStyle = gr; g.fillRect(mx - r * 3.4, my - r * 3.4, r * 6.8, r * 6.8);
  }
  const glowPass = (color, blur) => { g.save(); g.shadowColor = color; g.shadowBlur = blur; g.drawImage(ink, 0, 0); g.restore(); };
  if (o.glowSize > 0) glowPass(o.glow, S * k * o.glowSize);
  if (o.glow2Size > 0) glowPass(o.glow2, S * k * o.glow2Size);
  g.drawImage(ink, 0, 0);
  return { canvas: out, moon: { x: mx, y: my, r }, box: { x: x0, y: y0, w: totalW * k, h: totalH * k } };
}

/* ---------- per-option wordmark settings ---------- */
const CFG = {
  pond:     { sAlign: 'start', sSize: .16, fill: .6, maxH: .55 },
  moonrise: { font: F.ital, weight: 400, upper: true, sFont: F.ital, sWeight: 400, sSize: .15, sTrack: 1, sAlign: 'center', sGap: .22,
              box: [0, .06, 1, .48], fill: .62, maxH: .62, moonScale: 1, moonGap: .06, yShift: 0 },
  pool:     { font: F.syne, weight: 600, mode: 'inline', sWeight: 600, sUpper: false, fill: .72, moonScale: 1.04 },
  shallows: { font: F.fraun, weight: 600, sFont: F.fraun, sWeight: 600, sSize: .14, sTrack: .6, ink: '#1f2b52',
              glow: 'rgba(255,206,84,.75)', glowSize: .2, glow2: 'rgba(255,236,160,.8)', glow2Size: .05,
              halo: .22, haloRGB: '255,196,60', moonHalo: .7,
              moon: { light: '#fff3b8', mid: '#f2c94c', edge: '#c08a1e', mare: '140,95,20' }, fill: .62 },
  depths:   { upper: true, sWeight: 500, sSize: .16, sTrack: .9, sAlign: 'center', sGap: .22, ink: '#d9f4ef',
              glow: 'rgba(90,215,225,.55)', glowSize: .26, glow2: 'rgba(200,248,245,.65)', glow2Size: .05,
              halo: .16, haloRGB: '70,190,205', moonHalo: .5,
              moon: { light: '#f2fffb', mid: '#b9e6e1', edge: '#5f9ea0', mare: '30,90,95' },
              box: [0, .3, 1, .5], fill: .56, maxH: .62, moonScale: 1, moonGap: .05, yShift: 0 },
};

const fontList = new Set();
Object.values(CFG).forEach(c => {
  const o = { ...LOGO, ...c };
  fontList.add(fontStr(40, o.weight, o.style, o.font));
  fontList.add(fontStr(40, o.sWeight, o.sStyle, o.sFont || o.font));
});
await Promise.all([...fontList].map(f => document.fonts.load(f, 'Studio citron STUDIO CITRON').catch(() => {})));

/* ---------- shared animation loop ---------- */
const views = [];
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = views.find(v => v.el === e.target);
  if (v) { v.visible = e.isIntersecting; v.needs = true; }
}), { rootMargin: '80px' });
function register(el, draw) {
  const v = { el, draw, visible: false, needs: true };
  views.push(v); io.observe(el);
  return v;
}
function watchResize(el, fn) {
  let tm;
  new ResizeObserver(() => { clearTimeout(tm); tm = setTimeout(fn, 120); }).observe(el);
  fn();
}
function loop() {
  for (const v of views) {
    if (!v.visible || (REDUCED && !v.needs)) continue;
    v.needs = false;
    v.draw();
  }
  requestAnimationFrame(loop);
}
const rel = (e, el) => { const r = el.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };

/* ---------- WebGL views ---------- */
const PRELUDE = `
precision highp float;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime, uDpr;
uniform vec4 uDrops[8];
uniform vec3 uMouse, uMoon;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02+vec2(17.13,9.71); a*=.5; } return v; }
float fbm3(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.02+vec2(17.13,9.71); a*=.5; } return v; }
vec2 toP(vec2 f){ return (f-.5*uRes)/uRes.y; }
vec2 pToUv(vec2 p){ return p*vec2(uRes.y/uRes.x,1.)+.5; }
vec4 logoAt(vec2 uv){ return texture2D(uTex, clamp(uv, vec2(.001), vec2(.999))); }
float vignette(vec2 uv){ vec2 q=uv-.5; return 1.-dot(q,q)*.85; }
float dropH(vec2 p, float speed, float k){
  float h=0.; float asp=uRes.x/uRes.y;
  for(int i=0;i<8;i++){
    vec4 d=uDrops[i]; float age=uTime-d.z;
    if(age<0. || age>8.) continue;
    vec2 c=vec2((d.x-.5)*asp, d.y-.5);
    float r=length(p-c); float x=r-age*speed;
    h+=d.w*sin(x*k)*exp(-x*x*18.)*exp(-age*.5)/(1.+r*5.);
  }
  return h;
}
float caus(vec2 p, float t){
  vec2 i=floor(p), f=fract(p); float d1=8., d2=8.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 g=vec2(float(x),float(y));
    vec2 o=.5+.42*sin(t+6.2831*vec2(hash(i+g),hash(i+g+5.31)));
    float d=length(g+o-f);
    if(d<d1){ d2=d1; d1=d; } else if(d<d2){ d2=d; }
  }
  return 1.-smoothstep(0.,.2,d2-d1);
}
`;

const FS = {};

FS.pond = `
float H(vec2 p){
  float s=fbm(p*vec2(2.,3.2)+vec2(uTime*.05,-uTime*.07));
  return dropH(p,.3,46.)*.026 + (s-.5)*.09 + sin(p.y*26.+p.x*3.+uTime*1.1+s*5.)*.004;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=1.5/uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e);
  vec2 off=g*.011;
  vec4 L=logoAt(pToUv(p-off));
  vec3 bg=mix(vec3(.010,.016,.045), vec3(.035,.06,.13), uv.y);
  bg+=(fbm3(p*3.-off*20.)-.5)*.035;
  vec3 col=bg*(1.-L.a)+L.rgb;
  vec3 n=normalize(vec3(-g*.9,1.));
  float spec=pow(max(dot(n,normalize(vec3(-.25,.45,1.))),0.),90.);
  col+=spec*vec3(.6,.68,.85)*.5;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

FS.moonrise = `
vec3 sky(float y){
  float hz=.43; float s=clamp((y-hz)/(1.-hz),0.,1.);
  vec3 c=mix(vec3(.10,.10,.20), vec3(.012,.018,.055), pow(s,.55));
  return c+vec3(.14,.09,.05)*exp(-s*10.)*.6;
}
void main(){
  vec2 uv=gl_FragCoord.xy/uRes;
  float asp=uRes.x/uRes.y, hz=.43, t=uTime;
  vec3 col;
  if(uv.y>hz){
    vec3 s=sky(uv.y);
    vec2 sp=floor(gl_FragCoord.xy/(2.*uDpr));
    float st=hash(sp);
    s+=step(.9992,st)*(.55+.45*sin(t*2.+st*90.))*vec3(.75)*smoothstep(hz,hz+.25,uv.y);
    float md=length((uv-uMoon.xy)*vec2(asp,1.));
    s+=vec3(.95,.9,.7)*.07*exp(-md*3.5);
    vec4 L=logoAt(uv);
    col=s*(1.-L.a)+L.rgb;
  } else {
    float d=(hz-uv.y)/hz;
    float z=1./(d+.06);
    float X=(uv.x-.5)*asp*z;
    vec2 wp=vec2(X*1.4, z*1.6+t*.45);
    float n1=fbm3(wp*vec2(1.,3.)), n2=fbm3(wp*vec2(1.,3.)+vec2(7.3,2.1)-t*.15);
    float amp=.25+d;
    float ox=(n1-.5)*.045*amp, oy=(n2-.5)*.022*amp;
    float ry=2.*hz-uv.y;
    vec4 R=vec4(0.);
    for(int k=-2;k<=2;k++) R+=logoAt(vec2(uv.x+ox, ry+oy+float(k)*.004*(.3+d)));
    R/=5.;
    vec3 refl=sky(ry+oy)*(1.-R.a)+R.rgb;
    float fres=.5+.4*(1.-d);
    col=mix(vec3(.006,.01,.03), refl*vec3(.78,.82,.92), fres);
    float wdt=.012+d*.09;
    float mask=exp(-pow((uv.x+ox*1.5-uMoon.x)/wdt,2.));
    float sp=pow(noise(vec2(X*16., z*26.-t*1.6)),10.)*3.;
    col+=vec3(1.,.95,.8)*mask*(sp*(.4+d)+.05);
  }
  col+=vec3(.12,.11,.14)*exp(-abs(uv.y-hz)*140.)*.5;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

FS.pool = `
float H(vec2 p){ return fbm3(p*2.2+vec2(uTime*.12,uTime*.07)) + fbm3(p*3.6-vec2(uTime*.1,0.))*.18; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e);
  vec2 off=g*.0075;
  vec2 fp=p-off;
  vec2 tf=abs(fract(fp*8.)-.5);
  float grout=smoothstep(.465,.485,max(tf.x,tf.y));
  vec3 floorC=mix(vec3(.02,.15,.34), vec3(.05,.27,.50), uv.y*.7+.15);
  floorC*=1.-grout*.4;
  float c=pow(caus(fp*3.+g*.12,uTime*.9),2.)*.8 + pow(caus(fp*5.2+vec2(3.1,7.7),uTime*1.15),2.)*.45;
  vec4 L=logoAt(pToUv(fp));
  vec3 col=floorC*(1.-L.a)+L.rgb*vec3(.86,.97,1.);
  col+=c*vec3(.5,.85,1.)*.3*(1.-L.a*.6);
  vec3 n=normalize(vec3(-g*.5,1.));
  col+=pow(max(dot(n,normalize(vec3(-.3,.5,1.))),0.),70.)*vec3(.7,.9,1.)*.35;
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

FS.shallows = `
float H(vec2 p){ return fbm3(p*2.+vec2(uTime*.08,uTime*.05)) + fbm3(p*4.3-vec2(uTime*.06,0.))*.4; }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float e=2./uRes.y;
  vec2 g=vec2(H(p+vec2(e,0.))-H(p-vec2(e,0.)), H(p+vec2(0.,e))-H(p-vec2(0.,e)))/(2.*e);
  vec2 off=g*.0075;
  vec2 fp=p-off;
  vec3 sand=vec3(.90,.88,.80), aqua=vec3(.56,.80,.80);
  vec3 bg=mix(aqua,sand,smoothstep(-.7,.7,fp.x*.35+fp.y*.8+.3*(fbm3(fp*2.)-.5)));
  bg*=.965+.035*sin(fp.x*28.+fp.y*6.+fbm3(fp*2.)*9.);
  float c=pow(caus(fp*2.6+g*.1,uTime*.8),2.)*.4 + pow(caus(fp*4.4+9.,uTime),2.5)*.2;
  vec4 L=logoAt(pToUv(fp));
  vec3 col=bg*(1.-L.a)+L.rgb;
  col+=c*vec3(1.,1.,.94)*.3*(1.-L.a*.7);
  col*=.94+.06*vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

FS.depths = `
const vec3 LITE=vec3(.6,.97,1.);
float H(vec2 p){ return fbm3(p+vec2(uTime*.09,-uTime*.06)); }
void main(){
  vec2 uv=gl_FragCoord.xy/uRes, p=toP(gl_FragCoord.xy);
  float asp=uRes.x/uRes.y, t=uTime, hz=.5, ys=.665;
  vec2 sw=vec2(fbm3(p*2.4+vec2(t*.13,0.)), fbm3(p*2.4+vec2(4.1,t*.11)))-.5;
  vec2 q=uv+sw*vec2(.007,.009);
  vec3 fogC=mix(vec3(.004,.03,.045), vec3(.02,.11,.14), smoothstep(.25,.95,q.y));
  vec3 col; float fog;
  if(q.y>hz){
    float d=q.y-hz, z=.2/d;
    vec2 sp=vec2((q.x-.5)*asp*z, z*1.4+t*.18);
    float w=H(sp*.9);
    float c=pow(caus(sp*2.+w*1.2,t*.7),2.)*.9 + pow(caus(sp*3.4+vec2(5.3,1.7)-w,t*.9),2.)*.35;
    col=vec3(.03,.14,.17)+c*LITE*.55;
    float wv=(w-.5)*(.02+.06*d);
    vec4 R=logoAt(vec2(q.x+wv*1.4, 2.*ys-q.y+wv));
    col=col*(1.-R.a*.55)+R.rgb*vec3(.55,.85,.9)*.5*smoothstep(ys,ys+.015,q.y);
    fog=exp(-z*.55);
  } else {
    float d=hz-q.y, z=.28/d;
    vec2 fp=vec2((q.x-.5)*asp*z, z*1.2+t*.04);
    vec2 tf=abs(fract(fp*1.6+vec2(.5,0.))-.5);
    float grout=smoothstep(.465,.49,max(tf.x,tf.y));
    float w=H(fp*.8);
    float c=pow(caus(fp*1.7+w*1.3,t*.8),2.)*.75 + pow(caus(fp*3.+vec2(3.1,7.7)-w,t*1.05),2.)*.3;
    col=vec3(.02,.1,.13)*(1.-grout*.45)+c*LITE*.42;
    fog=exp(-z*.42);
  }
  col=mix(fogC,col,fog);
  float a=(q.x-.5)*asp/(1.7-q.y);
  float rays=pow(fbm3(vec2(a*6.+t*.04,t*.07)),3.)*smoothstep(.05,.95,q.y);
  col+=LITE*rays*.22;
  vec4 L=logoAt(q);
  float lc=pow(caus(p*4.2+sw*2.,t*.8),2.);
  col=col*(1.-L.a)+L.rgb*vec3(.82,.95,.96)*(.85+lc*.5);
  vec2 pp=p*vec2(9.,7.)-vec2(0.,t*.1);
  vec2 ci=floor(pp), cf=fract(pp);
  float h=hash(ci);
  vec2 o=vec2(hash(ci+1.7),hash(ci+3.1))*.8+.1+.07*sin(t*.5+h*20.+vec2(0.,1.6));
  col+=smoothstep(.04,0.,length(cf-o))*step(.8,h)*LITE*(.1+.1*sin(t+h*40.));
  col*=vignette(uv);
  gl_FragColor=vec4(col,1.);
}`;

function compile(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

function staticFallback(stage, logoOpts, bg) {
  const cv = stage.querySelector('canvas'), ctx = cv.getContext('2d');
  watchResize(cv, () => {
    const w = Math.round(cv.clientWidth * DPR), h = Math.round(cv.clientHeight * DPR);
    cv.width = w; cv.height = h;
    ctx.fillStyle = bg || '#070a14'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(makeLogo(w, h, logoOpts).canvas, 0, 0);
  });
}

function glView(id, frag, logoOpts, opt = {}) {
  const stage = document.getElementById(id), cv = stage.querySelector('canvas');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false });
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, PRELUDE + frag));
    gl.linkProgram(prog);
  } catch (err) {
    console.error(id, err);
    if (!gl) return staticFallback(stage, logoOpts, opt.bg);
    return;
  }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { tex: U('uTex'), res: U('uRes'), time: U('uTime'), dpr: U('uDpr'), drops: U('uDrops'), mouse: U('uMouse'), moon: U('uMoon') };
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);

  const drops = new Float32Array(32);
  for (let i = 0; i < 8; i++) drops[i * 4 + 2] = -1e3;
  let di = 0, moon = [.5, .5, .05], mouse = [.5, .5, 0], nextDrop = 1.2, lastMove = 0;
  const t0 = performance.now();
  const now = () => REDUCED ? 6 : (performance.now() - t0) / 1000;
  const addDrop = (x, y, s) => { drops.set([x, y, now(), s], di * 4); di = (di + 1) % 8; };

  let v;
  watchResize(cv, () => {
    let w = cv.clientWidth * DPR, h = cv.clientHeight * DPR;
    const sc = Math.min(1, (maxTex - 16) / Math.max(w, h));
    w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
    cv.width = w; cv.height = h; gl.viewport(0, 0, w, h);
    const L = makeLogo(w, h, logoOpts);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, L.canvas);
    moon = [L.moon.x / w, 1 - L.moon.y / h, L.moon.r / h];
    if (v) v.needs = true;
  });

  if (opt.interactive && !REDUCED) {
    stage.addEventListener('pointermove', e => {
      const [x, y] = rel(e, stage); mouse = [x, 1 - y, 1];
      const t = now();
      if (e.buttons || t - lastMove > .14) { addDrop(x, 1 - y, e.buttons ? .7 : .3); lastMove = t; }
    });
    stage.addEventListener('pointerdown', e => { const [x, y] = rel(e, stage); addDrop(x, 1 - y, 1.3); });
    stage.addEventListener('pointerleave', () => { mouse[2] = 0; });
  }
  if (REDUCED && opt.autoDrops) { addDrop(.42, .45, 1); drops[2] = 4.2; }

  v = register(stage, () => {
    const t = now();
    if (opt.autoDrops && !REDUCED && t > nextDrop) {
      addDrop(.18 + Math.random() * .64, .22 + Math.random() * .56, .8 + Math.random() * .5);
      nextDrop = t + 1.6 + Math.random() * 1.8;
    }
    gl.uniform1i(u.tex, 0);
    gl.uniform2f(u.res, cv.width, cv.height);
    gl.uniform1f(u.time, t);
    gl.uniform1f(u.dpr, cv.width / Math.max(1, cv.clientWidth));
    gl.uniform4fv(u.drops, drops);
    gl.uniform3fv(u.mouse, mouse);
    gl.uniform3fv(u.moon, moon);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });
}

/* ---------- start ---------- */
glView('v01', FS.pond, CFG.pond, { interactive: true, autoDrops: true });
glView('v03', FS.moonrise, CFG.moonrise);
glView('v05', FS.pool, CFG.pool, { bg: '#0a2e5c' });
glView('v12', FS.shallows, CFG.shallows, { bg: '#bfe0dc' });
glView('v14', FS.depths, CFG.depths, { bg: '#04161d' });
requestAnimationFrame(loop);
})();
</script>
